<svg viewBox="0 0 240 240" width="240" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Afri CRM teal gradient (premium feel vs flat HubSpot orange) -->
    <linearGradient id="afriTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <!-- Subtle inner shadow for depth -->
    <radialGradient id="afriTealRadial" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </radialGradient>
    <!-- Dark background gradient (matching CRM design system) -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <!-- Glow effect for the dots -->
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark rounded background -->
  <rect width="240" height="240" rx="48" fill="url(#bgGrad)"/>

  <!-- Subtle teal glow background tint -->
  <circle cx="120" cy="120" r="100" fill="url(#afriTeal)" opacity="0.04"/>

  <!-- Three radiating lines (sprocket spokes) -->
  <g stroke="url(#afriTeal)" stroke-width="11" stroke-linecap="round" fill="none">
    <!-- Top spoke -->
    <line x1="120" y1="84" x2="120" y2="36"/>
    <!-- Bottom-right spoke -->
    <line x1="151" y1="141" x2="196" y2="167"/>
    <!-- Bottom-left spoke -->
    <line x1="89" y1="141" x2="44" y2="167"/>
  </g>

  <!-- Central ring (open circle — the sprocket hub) -->
  <circle cx="120" cy="120" r="36" fill="none" stroke="url(#afriTeal)" stroke-width="11"/>

  <!-- Three solid dots at the end of each spoke (with subtle radial gradient) -->
  <g fill="url(#afriTealRadial)" filter="url(#dotGlow)">
    <circle cx="120" cy="24" r="14"/>
    <circle cx="203" cy="172" r="14"/>
    <circle cx="37" cy="172" r="14"/>
  </g>

  <!-- Subtle highlight on top dot -->
  <circle cx="116" cy="20" r="5" fill="#ffffff" opacity="0.4"/>
</svg>
